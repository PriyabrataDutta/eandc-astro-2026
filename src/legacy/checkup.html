<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
	<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H6MP2261FR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-H6MP2261FR');
</script>
</head>
<body>

    <a href="./pdf/Form MGT-7 2021.pdf"></a>
  <canvas id="pdfViewer" style="border: 1px solid black;"></canvas>

  <script>
    const pdfPath = './pdf/Form MGT-7 2021.pdf';

    // PDF.js worker from the 'build' folder
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.js';

    pdfjsLib.getDocument(pdfPath).promise.then(pdfDoc => {
      let pageNum = 1;
      pdfDoc.getPage(pageNum).then(page => {
        const scale = 1.5;
        const viewport = page.getViewport({ scale });
        const canvas = document.getElementById('pdfViewer');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: context,
          viewport: viewport,
        };
        page.render(renderContext);
      });
    });
  </script>

</body>
</html>
